name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install sdl3

      - name: Run smoke test
        run: QUIET_BUILD=1 python3 scripts/ever2e.py smoke

  microcode-tests:
    name: Microcode Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install sdl3

      - name: Run microcode tests
        run: QUIET_BUILD=1 python3 scripts/ever2e.py microcode-tests
